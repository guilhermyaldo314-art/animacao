<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memória Artística PRO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  min-height:100vh;

  background:
  radial-gradient(circle at top,#1e293b,#020617);

  font-family:'Poppins',sans-serif;

  color:white;

  overflow-x:hidden;
}

.particles{
  position:fixed;
  inset:0;

  background:
  radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);

  background-size:30px 30px;

  animation:moveBg 10s linear infinite;

  z-index:-1;
}

@keyframes moveBg{

  from{
    transform:translateY(0px);
  }

  to{
    transform:translateY(30px);
  }

}

header{
  text-align:center;

  padding:40px 20px 20px;
}

header h1{
  font-size:3rem;

  margin-bottom:10px;

  background:
  linear-gradient(90deg,#60a5fa,#ffffff);

  -webkit-background-clip:text;

  -webkit-text-fill-color:transparent;
}

header p{
  color:#cbd5e1;
}

.dashboard{
  width:95%;
  max-width:1200px;

  margin:auto;

  display:flex;
  justify-content:center;
  align-items:center;

  gap:20px;

  flex-wrap:wrap;
}

.card-info{
  width:200px;

  padding:20px;

  background:rgba(255,255,255,0.08);

  border:1px solid rgba(255,255,255,0.1);

  backdrop-filter:blur(15px);

  border-radius:25px;

  box-shadow:0 8px 25px rgba(0,0,0,0.4);

  text-align:center;
}

.card-info span{
  display:block;

  margin-bottom:10px;

  color:#cbd5e1;
}

.card-info h2{
  font-size:2rem;
}

#restartBtn{
  padding:18px 30px;

  border:none;

  border-radius:20px;

  background:
  linear-gradient(135deg,#2563eb,#1d4ed8);

  color:white;

  font-size:1rem;
  font-weight:600;

  cursor:pointer;

  transition:0.3s;
}

#restartBtn:hover{
  transform:translateY(-3px);
}

.game-board{
  width:95%;
  max-width:1200px;

  margin:40px auto;

  display:grid;

  grid-template-columns:repeat(4,1fr);

  gap:20px;
}

.memory-card{
  position:relative;

  width:100%;
  height:220px;

  transform-style:preserve-3d;

  transition:transform 0.7s;

  cursor:pointer;
}

.memory-card.flip{
  transform:rotateY(180deg);
}

.front-face,
.back-face{
  position:absolute;

  width:100%;
  height:100%;

  border-radius:25px;

  overflow:hidden;

  backface-visibility:hidden;
}

.front-face{
  background:
  linear-gradient(135deg,#2563eb,#1e40af);

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:4rem;

  box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.back-face{
  transform:rotateY(180deg);

  background:white;
}

.back-face img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.memory-card.matched{
  animation:matchedGlow 1s infinite alternate;

  pointer-events:none;
}

@keyframes matchedGlow{

  from{
    box-shadow:0 0 10px #22c55e;
  }

  to{
    box-shadow:0 0 30px #22c55e;
  }

}

.win-screen{
  position:fixed;
  inset:0;

  background:rgba(0,0,0,0.85);

  display:none;
  justify-content:center;
  align-items:center;
}

.win-box{
  width:90%;
  max-width:500px;

  padding:40px;

  border-radius:30px;

  background:#0f172a;

  text-align:center;
}

.win-box h2{
  font-size:3rem;

  margin-bottom:20px;
}

.win-box p{
  margin-bottom:20px;

  color:#cbd5e1;
}

.results{
  margin-bottom:20px;

  line-height:2;
}

.win-box button{
  padding:18px 35px;

  border:none;

  border-radius:20px;

  background:#22c55e;

  color:white;

  cursor:pointer;
}

@media(max-width:900px){

  .game-board{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:650px){

  .game-board{
    grid-template-columns:repeat(2,1fr);
  }

  .memory-card{
    height:180px;
  }

  header h1{
    font-size:2.2rem;
  }

}

</style>
</head>

<body>

<div class="particles"></div>

<header>

  <h1>🎨 Memória Artística PRO</h1>

  <p>Impressionismo & Realismo</p>

</header>

<section class="dashboard">

  <div class="card-info">
    <span>⏱ Tempo</span>
    <h2 id="timer">00:00</h2>
  </div>

  <div class="card-info">
    <span>🏆 Pontos</span>
    <h2 id="score">0</h2>
  </div>

  <div class="card-info">
    <span>🎯 Tentativas</span>
    <h2 id="moves">0</h2>
  </div>

  <button id="restartBtn">
    🔄 Reiniciar
  </button>

</section>

<section class="game-board" id="gameBoard"></section>

<div class="win-screen" id="winScreen">

  <div class="win-box">

    <h2>🏆 Vitória!</h2>

    <p>Você encontrou todos os pares.</p>

    <div class="results" id="finalStats"></div>

    <button onclick="restartGame()">
      Jogar Novamente
    </button>

  </div>

</div>

<script>

const artworks = [

  {
    id:1,
    artist:"Impressionismo",
    image:"https://static.todamateria.com.br/upload/im/pr/impressaonascerdosol-cke.jpg"
  },

  {
    id:2,
    artist:"Millet",
    image:"https://static.todamateria.com.br/upload/je/an/jeanfrancoismilletangelus-cke.jpg"
  },

  {
    id:3,
    artist:"Monet",
    image:"https://www.abramus.org.br/wp-content/uploads/2011/03/dans-la-prairie-monet.jpg"
  },

  {
    id:4,
    artist:"Restolhos",
    image:"https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhvz1sj6wyLYGzVKxmUyk9ELju2Hv5RQdjfBP-jzeybOMjxdNnn6mn0PIaXSG2IualqsTm_rwrm9HZZzTCZZslGkSDxJgyJgmLXv-xdxtbVmd5cFsdB9qA5_opcGdVrGfO84Q9dGSbjBEfT/w1200-h630-p-k-no-nu/millet-restolhos.jpg"
  },

  {
    id:5,
    artist:"Van Gogh",
    image:"https://cdn-blog.superprof.com/blog_br/wp-content/uploads/2024/05/van-gogh-impressionismo.jpg"
  },

  {
    id:6,
    artist:"Monet Almoço",
    image:"https://www.historiadasartes.com/wp-content/uploads/2015/10/17.35MonetAlmoco.jpg"
  }

];

const board = document.getElementById("gameBoard");

const scoreText = document.getElementById("score");

const movesText = document.getElementById("moves");

const timerText = document.getElementById("timer");

const finalStats =
document.getElementById("finalStats");

const winScreen =
document.getElementById("winScreen");

const restartBtn =
document.getElementById("restartBtn");

let firstCard = null;
let secondCard = null;
let lockBoard = false;

let score = 0;
let moves = 0;
let matchedPairs = 0;

let seconds = 0;
let timer;

function startTimer(){

  timer = setInterval(() => {

    seconds++;

    const mins =
    Math.floor(seconds / 60);

    const secs = seconds % 60;

    timerText.textContent =
    `${String(mins).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;

  },1000);

}

function shuffleCards(array){

  for(let i = array.length -1; i > 0; i--){

    const j =
    Math.floor(Math.random() * (i + 1));

    [array[i], array[j]] =
    [array[j], array[i]];

  }

  return array;

}

function createBoard(){

  board.innerHTML = "";

  const duplicatedCards =
  artworks.flatMap(card => [
    {...card},
    {...card}
  ]);

  const shuffled =
  shuffleCards(duplicatedCards);

  shuffled.forEach(cardData => {

    const card =
    document.createElement("div");

    card.classList.add("memory-card");

    card.dataset.id = cardData.id;

    card.innerHTML = `

      <div class="front-face">
        🎨
      </div>

      <div class="back-face">
        <img src="${cardData.image}" alt="${cardData.artist}">
      </div>

    `;

    card.addEventListener(
      "click",
      flipCard
    );

    board.appendChild(card);

  });

}

function flipCard(){

  if(lockBoard) return;

  if(this === firstCard) return;

  this.classList.add("flip");

  if(!firstCard){

    firstCard = this;

    return;

  }

  secondCard = this;

  moves++;

  movesText.textContent = moves;

  checkForMatch();

}

function checkForMatch(){

  const isMatch =
  firstCard.dataset.id === secondCard.dataset.id;

  isMatch
  ? disableCards()
  : unflipCards();

}

function disableCards(){

  firstCard.classList.add("matched");

  secondCard.classList.add("matched");

  score += 100;

  matchedPairs++;

  scoreText.textContent = score;

  resetBoard();

  if(matchedPairs === artworks.length){

    clearInterval(timer);

    setTimeout(() => {

      winScreen.style.display = "flex";

      finalStats.innerHTML = `
        ⏱ Tempo: ${timerText.textContent}<br>
        🎯 Tentativas: ${moves}<br>
        🏆 Pontuação: ${score}
      `;

    },800);

  }

}

function unflipCards(){

  lockBoard = true;

  setTimeout(() => {

    firstCard.classList.remove("flip");

    secondCard.classList.remove("flip");

    resetBoard();

  },1000);

}

function resetBoard(){

  [firstCard, secondCard] =
  [null, null];

  lockBoard = false;

}

function restartGame(){

  clearInterval(timer);

  firstCard = null;
  secondCard = null;

  lockBoard = false;

  score = 0;
  moves = 0;
  matchedPairs = 0;

  seconds = 0;

  scoreText.textContent = "0";
  movesText.textContent = "0";
  timerText.textContent = "00:00";

  winScreen.style.display = "none";

  createBoard();

  startTimer();

}

restartBtn.addEventListener(
  "click",
  restartGame
);

createBoard();

startTimer();

</script>

</body>
</html>
